name: Build and Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: |
          npm run build
          cp package.json dist/server/

      - name: Create target directory on VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22029
          script: |
            mkdir -p /var/www/portfolio/client
            mkdir -p /var/www/portfolio/server

      - name: Deploy files to VPS via rsync
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > private_key
          chmod 600 private_key
          rsync -avz --delete -e "ssh -i private_key -o StrictHostKeyChecking=no -p 22029" dist/client/ ${{ secrets.USER }}@${{ secrets.HOST }}:/var/www/portfolio/client/
          rsync -avz --delete -e "ssh -i private_key -o StrictHostKeyChecking=no -p 22029" dist/server/ ${{ secrets.USER }}@${{ secrets.HOST }}:/var/www/portfolio/server/
          rm -f private_key
      - name: Install production dependencies on VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22029
          script: |
            cd /var/www/portfolio/server
            npm ci
            npm install astro
            npm install send server-destroy
            PORT=8092 pm2 restart portfolio || PORT=8092 pm2 start entry.mjs --name portfolio
